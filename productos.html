<section class="mt-4">
  <form id="productoForm" class="row g-3">
    <div class="col-md-3">
      <label for="marca" class="form-label">Marca</label>
      <input type="text" id="marca" class="form-control" required>
    </div>
    <div class="col-md-3">
      <label for="modelo" class="form-label">Modelo</label>
      <input type="text" id="modelo" class="form-control" required>
    </div>
    <div class="col-md-2">
      <label for="color" class="form-label">Color</label>
      <input type="text" id="color" class="form-control" required>
    </div>
    <div class="col-md-2">
      <label for="talla" class="form-label">Talla</label>
      <input type="number" id="talla" class="form-control" required>
    </div>
    <div class="col-md-2">
      <label for="stock" class="form-label">Stock</label>
      <input type="number" id="stock" class="form-control" required>
    </div>
    <div class="col-md-2">
      <label for="precioCompra" class="form-label">Precio Compra</label>
      <input type="number" id="precioCompra" class="form-control" required>
    </div>
    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Guardar Producto</button>
    </div>
  </form>
</section>

<section class="mt-5">
  <h2>Inventario</h2>
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Color</th>
        <th>Talla</th>
        <th>Precio Compra</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
  </table>
</section>
