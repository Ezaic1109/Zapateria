<section class="mt-4">
  <form id="ventaForm" class="row g-3">
    <div class="col-md-4">
      <label for="venta_cliente" class="form-label">Cliente (para crédito)</label>
      <select id="venta_cliente" class="form-select">
        <option value="">-- (Selecciona) --</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="venta_producto" class="form-label">Producto</label>
      <select id="venta_producto" class="form-select" required></select>
    </div>
    <div class="col-md-2">
      <label for="venta_cantidad" class="form-label">Cantidad</label>
      <input type="number" id="venta_cantidad" class="form-control" min="1" value="1" required>
    </div>
    <div class="col-md-2">
      <label for="venta_precio" class="form-label">Precio</label>
      <input type="number" id="venta_precio" class="form-control" readonly required>
    </div>

    <div class="col-md-4">
      <label for="venta_tipoPago" class="form-label">Tipo de Pago</label>
      <select id="venta_tipoPago" class="form-select">
        <option value="Contado">Contado</option>
        <option value="Crédito">Crédito</option>
      </select>
    </div>

    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Agregar al carrito</button>
    </div>
  </form>
</section>

<div id="cart" class="mt-3"></div>

<div class="row mt-3 align-items-center">
  <div class="col-md-8 text-start">
    <button id="btnFinalizarVenta" class="btn btn-success">Finalizar Venta</button>
    <button id="btnLimpiarCart" class="btn btn-danger">Limpiar Carrito</button>
  </div>
</div>

<section class="mt-5">
  <h2>Ventas Registradas</h2>
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Productos</th>
        <th>Cantidad total</th>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="tablaVentas"></tbody>
  </table>
</section>
